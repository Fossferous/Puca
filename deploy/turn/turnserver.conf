# Puca self-hosted TURN relay (coturn) — template.
# Prod values for chat.example.com; adjust IPs for your own deployment.
#
# Non-standard port 3479: 3478/5349 on this site's router already forward to a
# different VM (Matrix). Router must forward UDP+TCP 3479 and UDP 49180-49220
# to this host.

listening-port=3479
# IPs are deployment-specific — inject the real values at deploy time (like the
# static-auth-secret below); never commit real addresses to the repo.
# listening-ip / relay-ip: this host's LAN interface IP.
listening-ip=YOUR_LAN_IP
relay-ip=YOUR_LAN_IP
# Behind NAT: advertise the public address for the private one.
external-ip=YOUR_PUBLIC_IP/YOUR_LAN_IP

# Relay allocation range — keep small (each voice/screen session uses one port)
# and matched EXACTLY by the router forward. 41 ports (49180..49220 incl.);
# total-quota below is kept under this so quota, not port exhaustion, is the cap.
# Range chosen to clear an existing forward on another LAN host (UDP 49152-49172)
# and stay below its 50000-60000 block.
min-port=49180
max-port=49220

# TURN REST credentials: the Puca backend mints time-limited usernames
# ("<expiry>:<user id>") and HMAC-SHA1 credentials under this shared secret.
# The real secret lives only in /etc/turnserver.conf on the host and in
# /opt/puca/.env (TURN_SECRET) — never in the repo.
use-auth-secret
static-auth-secret=REPLACED_AT_DEPLOY
realm=example.com

fingerprint

# The relay must never reach into private networks (SSRF from the internet
# into the LAN).
no-multicast-peers
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
# coturn does NOT support inline comments — labels must be on their own lines.
denied-peer-ip=192.0.0.0-192.0.0.255
# 192.0.2.0/24 TEST-NET-1, 192.88.99.0/24 6to4 relay anycast
denied-peer-ip=192.0.2.0-192.0.2.255
denied-peer-ip=192.88.99.0-192.88.99.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
# 198.51.100.0/24 TEST-NET-2, 203.0.113.0/24 TEST-NET-3
denied-peer-ip=198.51.100.0-198.51.100.255
denied-peer-ip=203.0.113.0-203.0.113.255
denied-peer-ip=224.0.0.0-255.255.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff
# Deny THIS site's own public IP as a relay target: legitimate WebRTC peers
# relay to each OTHER's addresses, never to the TURN server's public IP, so
# denying it costs nothing and closes the hairpin-NAT pivot into every LAN
# service port-forwarded on this address (Matrix 8448, other remote-access tools, etc.).
denied-peer-ip=YOUR_PUBLIC_IP

# Friends-scale quotas: cap concurrent allocations and bandwidth so leaked or
# abused credentials can't saturate the uplink. total-quota stays under the
# relay port count (max-port-min-port+1 = 41) so the quota is the real ceiling.
# NOTE: coturn's *-bps directives are BYTES/sec — 1,250,000 B/s = 10 Mbps,
# 2,500,000 B/s = 20 Mbps.
#
# CRITICAL — set bps-capacity BELOW your measured UPLOAD speed (a relay both
# receives and re-sends, so it consumes upload for every stream). The previous
# 50 Mbps aggregate exceeded a typical residential uplink, so a few relayed
# streams (or one abusive credential) could saturate the home line and starve
# the backend. Measure your upstream and leave headroom for HTTP/WS traffic.
user-quota=12
total-quota=40
max-bps=1250000
bps-capacity=2500000

stale-nonce=600
no-cli
no-tlsv1
no-tlsv1_1
# TLS (turns:) not configured yet — plain TURN only; media inside is already
# DTLS-SRTP + Puca frame E2EE, so the TURN wrapper carries no secrets.
no-tls
no-dtls
