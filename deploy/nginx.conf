# nginx reverse-proxy config for the Puca backend.
#
# Install as /etc/nginx/sites-available/puca and symlink into
# sites-enabled. Replace chat.example.com with your domain. Obtain
# certificates first:  sudo certbot certonly --nginx -d chat.example.com
#
# The entire origin is proxied to the backend: the API lives at the root
# (e.g. /auth/login/step1, /servers, /ws, /files/:id). Build the desktop app
# with VITE_API_URL=https://chat.example.com (no /api suffix).

# WebSocket upgrade handling: pass "Connection: upgrade" only when the client
# actually requested an upgrade, otherwise use normal keep-alive.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 443 ssl;
    http2 on;
    server_name chat.example.com;

    ssl_certificate     /etc/letsencrypt/live/chat.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chat.example.com/privkey.pem;

    # Security headers (the app itself adds COOP/COEP).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Uploads are capped at 25 MB by the app (28 MB request limit incl. framing).
    client_max_body_size 32m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # WebSocket upgrade (used by /ws; harmless for plain HTTP).
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # The backend rate limiter keys clients by X-Forwarded-For and trusts the
        # LEFTMOST entry. Set it to the real peer ($remote_addr) — do NOT use
        # $proxy_add_x_forwarded_for here, which APPENDS to any client-supplied
        # header and lets an attacker spoof the leftmost value to get a fresh
        # limiter bucket per request (bypassing the 5/s auth and 50/s API limits).
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # nginx passes unrecognised client headers through untouched. The backend
        # prefers CF-Connecting-IP when TRUST_CF_CONNECTING_IP=true, so clear it
        # here: without this a client could supply its own and re-key itself per
        # request. Behind real Cloudflare, drop this line and set that env var.
        proxy_set_header CF-Connecting-IP "";

        # Keep long-lived WebSocket connections open.
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}

server {
    listen 80;
    server_name chat.example.com;
    return 301 https://$host$request_uri;
}
