[package]
name = "puca-capture"
version = "0.1.0"
edition = "2021"
description = "Native screen capture for the Puca host agent — no picker, no user gesture"
license = "AGPL-3.0-or-later"

[dependencies]

# DXGI Desktop Duplication. Chosen over Windows.Graphics.Capture for the agent:
# WGC draws a yellow border that cannot be disabled before Win11 22000, and an
# unattended host that permanently outlines the screen is not shippable. The
# trade-off is that duplication cannot capture the secure desktop (UAC / lock
# screen) — but neither can WGC, and that boundary belongs to the SYSTEM service
# work regardless.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    # GetCursorInfo/GetIconInfo, for seeding the cursor at capture-open —
    # DXGI only reports the shape on CHANGE, so a fresh capture drew no
    # pointer until the host's own mouse produced a delta.
    "Win32_UI_WindowsAndMessaging",
] }

# X11 capture on Linux. x11rb is PURE RUST — it speaks the X11 wire protocol
# over a socket rather than binding libX11, so building needs no C headers and
# no libx11-dev. That matters beyond convenience: the agent has to build on
# machines where installing dev packages needs root, and a header dependency
# would make the Linux host undeployable exactly where it is most wanted.
#
# Wayland is deliberately NOT here. It needs xdg-desktop-portal ScreenCast with
# a persisted restore_token plus PipeWire, which is a much larger piece — and
# per the plan, X11 first covers most self-hosters at about a third of the cost.
[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13", default-features = false, features = ["shm"] }

# The X11 live test draws a known colour on the display and asserts the capture
# returns exactly that -- an assertion a stub or a black buffer cannot pass.
# Drawing needs the same X client the implementation uses.
[target.'cfg(target_os = "linux")'.dev-dependencies]
x11rb = { version = "0.13", default-features = false, features = ["shm"] }
