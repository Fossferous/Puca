[package]
name = "puca-waker"
version = "0.1.0"
edition = "2021"
description = "Always-on LAN node that answers Puca's Wake button with a magic packet"
license = "AGPL-3.0-or-later"
publish = false

[dependencies]
# One socket, one four-hour timer, one rare datagram. `current_thread` because
# a multi-threaded runtime on a box already running Postgres, Caddy and coturn
# would be pure overhead.
tokio = { version = "1", features = ["rt", "macros", "net", "time", "signal", "io-util"] }
tokio-tungstenite = { version = "0.21", features = ["native-tls"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }

# The whole runtime crypto surface: sign the attestation transcript. Everything
# else the waker presents (device id, auth record, auth signature) is static
# text produced once at provisioning and read from a file.
ed25519-dalek = "2"
x25519-dalek = { version = "2", features = ["static_secrets"] }
sha2 = "0.10"
base64 = "0.22"
getrandom = "0.2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Shares the TLS stack with tokio-tungstenite's native-tls rather than pulling
# in a second one.
#
# 0.12 (hyper 1), which takes reqwest 0.11 / hyper 0.14 / h2 0.3 - and
# RUSTSEC-2026-0258 with them - out of the workspace lockfile. `native-tls`
# without `native-tls-alpn` and without `http2`: HTTP/1.1 only, exactly what
# 0.11 spoke. `charset` keeps 0.11's `.text()` decoding. From 0.12 an error's
# Display drops its cause: net.rs logs through `http_err`.
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls", "charset"] }
