[package]
name = "puca-input"
version = "0.1.0"
edition = "2021"
description = "Input injection and display geometry, shared by the Puca desktop app and the native host agent"
license = "AGPL-3.0-or-later"

[dependencies]
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
# The wire shape is JSON, so the parse tests need a JSON impl.
serde_json = "1"

# The CARET SAMPLER, off by default.
#
# `frontend/src-tauri` depends on this crate too (src-tauri/Cargo.toml:53) and
# has no use for a caret: only the host agent reports one. A default-on feature
# would make every desktop-app build compile the Accessibility, COM and Ole
# bindings — thousands of generated items — for code it never calls. The agent
# turns it on in its own dependency line; the probe wants
# `--features caret` on the command line.
#
# The windows features are listed here rather than unconditionally above for the
# same reason. Verified against the vendored windows-0.58.0: `IAccessible` is
# gated on `Win32_System_Com` (Accessibility/mod.rs:1161), the `SafeArray*`
# helpers live in `Win32::System::Ole` (Ole/mod.rs:1041-1231) and NOT in Com,
# and `LoadLibraryExW`/`GetProcAddress` — which tier 2 must use rather than a
# static import, see caret.rs — need `Win32_System_LibraryLoader`.
# `MapWindowPoints` is in `Win32::Graphics::Gdi` (Gdi/mod.rs:2073) despite being
# a user32 export, and `Win32_Graphics_Gdi`/`Win32_UI_HiDpi`/
# `Win32_UI_WindowsAndMessaging`/`Win32_System_StationsAndDesktops` are already
# on unconditionally.
[features]
caret = [
    "windows/Win32_UI_Accessibility",
    "windows/Win32_System_Com",
    "windows/Win32_System_Ole",
    "windows/Win32_System_LibraryLoader",
]

# ONLY for `examples/caret_probe.rs`, which exists to print the DXGI desktop
# rects beside the GDI ones — the divergence that decides the whole coordinate
# mapping, and the one thing a unit test cannot fabricate honestly. No cycle:
# puca-capture does not depend on this crate.
[target.'cfg(windows)'.dev-dependencies]
puca-capture = { path = "../puca-capture" }

# Windows-only: SendInput, monitor enumeration, and the anti-cheat process scan.
# Every other platform gets the hard-error stubs already in lib.rs — an agent
# that silently accepted input it cannot inject would look connected and do
# nothing.
[target.'cfg(windows)'.dependencies]
sysinfo = "0.32"
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_StationsAndDesktops",
    "Win32_Graphics_Gdi",
    "Win32_UI_HiDpi",
] }

# X11 injection on Linux via XTEST. Pure Rust, same reasoning as the capture
# crate: no C headers, so the agent builds on a machine where installing dev
# packages needs root. XTEST needs no elevated privilege at all, unlike
# /dev/uinput -- which is why it is the X11 path and uinput is left to the
# Wayland work, where a portal is required anyway.
[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13", default-features = false, features = ["xtest"] }

# The live injection test asserts on OBSERVED EFFECT -- where the pointer landed
# and which key event a real window received -- so it needs its own X client to
# create that window and read those events back.
[target.'cfg(target_os = "linux")'.dev-dependencies]
x11rb = { version = "0.13", default-features = false, features = ["xtest"] }
