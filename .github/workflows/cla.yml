# CLA check on every pull request, via CLA Assistant Lite
# (https://github.com/contributor-assistant/github-action).
#
# This is the self-hosted, free replacement for the original cla-assistant.io
# hosted bot, which stopped accepting new projects. It works entirely inside
# GitHub Actions: no external service, no OAuth app to install.
#
# NOTHING NEEDS DOING BY HAND, and no Personal Access Token is needed. The
# workflow reads CLA.md and posts a comment on any PR from a contributor who
# hasn't signed, asking them to reply with the sentence configured below.
# Signatures are recorded in .github/cla-signatures.json on the
# `cla-signatures` branch of THIS repository, which the action creates and
# commits to by itself.
#
# The only credential is the built-in GITHUB_TOKEN, with the write
# permissions this job grants it (below). The action asks for a PAT only to
# store signatures in a DIFFERENT repository or organisation (its
# `remote-repository-name` / `remote-organization-name` inputs: at the pinned
# commit, src/octokit.ts getPATOctokit is used for nothing else); ours live
# here, so it never reads one. If signatures ever move to another repository,
# that move is when a PAT with access to it becomes necessary — add it then
# as the PERSONAL_ACCESS_TOKEN secret and pass it in `env`.
#
# Nobody's GitHub OAuth is granted to a third party for this to work.

name: "CLA Assistant Lite"
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla-check:
    runs-on: ubuntu-latest
    steps:
      - name: "CLA Assistant Lite"
        if: (github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        # Pinned to the commit a version TAG can point anywhere it likes; a
        # commit SHA cannot. This is not paranoia — this action has write
        # access to the repo (contents: write) to commit signatures.
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: '.github/cla-signatures.json'
          path-to-document: 'https://raw.githubusercontent.com/Fossferous/Puca/main/CLA.md'
          branch: 'cla-signatures'
          # Bots cannot sign: Dependabot and the Actions bot open PRs that
          # must not sit red on the CLA check (every Dependabot PR did, 0906).
          allowlist: Fossferous,dependabot[bot],dependabot*,github-actions[bot]
          custom-pr-sign-comment: 'I have read the CLA Document and I hereby sign the CLA'
          custom-notsigned-prcomment: >
            Thanks for the contribution! Before this can be merged, please
            confirm you've read and agree to the
            [Contributor License Agreement](https://github.com/Fossferous/Puca/blob/main/CLA.md)
            by replying to this comment with exactly:

            > I have read the CLA Document and I hereby sign the CLA
