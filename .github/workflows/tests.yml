name: tests

# Regression gate so breakages are caught without relying on manual local runs.
# - frontend: typecheck + build + vitest (offline, always runs)
# - backend:  cargo build + start server (which applies migrations) + cargo test
#             + the feature-flows API regression, all against a Postgres service
# Least privilege: these jobs only ever read the tree. Without this block the
# workflow inherits the repository default, which can be read/write on every
# scope — an unnecessary token to hand to any step, and to every dependency
# those steps install.
permissions:
  contents: read

on:
  push:
    # main is the trunk. It was [feature/e2ee-security-and-chat, main] while all
    # 309 commits of real work landed on feature/sfu-tier2, so CI never ran on
    # anything that shipped. Also match work/** so a session's branch is tested
    # BEFORE it is merged, which is the whole point of parallel branches.
    branches: [main, 'work/**']
  pull_request:
  workflow_dispatch:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Typecheck + build
        run: npm run build           # tsc -b && vite build
      - name: Unit tests (vitest)
        run: npm test                 # vitest run — offline, ~125 cases
      - name: Lite bundle (rc-exclusion-guard must pass)
        run: node scripts/build-lite.mjs   # VITE_ENABLE_RC=false: fails if remote-control code is in the graph
      # Two classes of defect that are invisible to tsc, vitest and eslint,
      # because the code is correct and the WORDS in it are wrong. Both have
      # shipped: a user-facing diagnostic telling people to install the APK
      # from download.example.com, and a "TODO: Replace with your production
      # server URL" sitting above the line that already did it, on the most
      # security-relevant configuration point in the client.
      - name: Source hygiene (placeholder domains, unowned TODO markers)
        run: node scripts/check-source-hygiene.mjs
      # docs/GETTING_STARTED.md pointed every new self-hoster at
      # `.agent/HANDOFF.md`, a directory scrubbed for the public repo. Needs the
      # git checkout (it asks git which paths are tracked and which are ignored
      # on purpose), which actions/checkout already provides.
      - name: Docs links resolve
        run: node ../scripts/check-docs-links.mjs
      # NON-BLOCKING on purpose: the registry's answer changes daily, so gating
      # merges on it makes CI fail for reasons no commit caused. The triage
      # lives in docs/NPM_ADVISORIES.md; this step is what makes drift from it
      # visible. If the log and that file disagree, the file is out of date.
      - name: npm audit (advisory drift — never blocks)
        run: npm audit --audit-level=high || true

  # The deploy scripts run once, as root, on a box that has already been paid
  # for, and their failures are silent: a backup that restores nothing, a config
  # world-readable for the moment it holds a secret, a download page advertising
  # last release. Each of these tests runs offline against fixtures and stubs —
  # no host is contacted and no real hosts.conf is read.
  deploy-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: coturn config rendering
        run: bash deploy/migrate/render-turn-conf.test.sh
      - name: provision.sh (file modes, secrets off argv)
        run: bash deploy/migrate/provision.test.sh
      - name: backup-keys.sh (the key/password split, and its file modes)
        run: bash deploy/ops/backup-keys.test.sh
      - name: dual-ship.sh / check-versions.sh refusal gates
        run: bash deploy/ops/ship-gates.test.sh

  # Known-vulnerable Rust dependencies. Nothing watched for these: `npm audit`
  # covered the JS side, but an advisory against a crate in either Cargo.lock
  # could sit unnoticed indefinitely — in a product that ships E2EE and a
  # remote-desktop agent.
  #
  # THIS ONE BLOCKS, unlike the npm step above, and the asymmetry is deliberate.
  # npm's advisory stream is noisy enough that a blocking gate would be routinely
  # overridden, which teaches you to ignore it. RustSec is quiet, and this repo
  # already has the right escape hatch: .cargo/audit.toml, where an advisory that
  # has been read and judged not to apply is listed WITH ITS REASONING (see the
  # RUSTSEC-2023-0071 entry). So a red run here has exactly two honest answers —
  # update the dependency, or write down why it does not apply.
  #
  # cwd MUST stay the repo root: cargo-audit only reads .cargo/audit.toml
  # relative to the working directory, so cd-ing into a sub-crate would silently
  # drop the allowlist and red-light an already-accepted advisory. Hence -f.
  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable branch, pinned 2026-07-23
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Backend + crates/* (the shared workspace lock)
        run: cargo audit -f Cargo.lock
      - name: Desktop shell (excluded from the workspace, so its own lock)
        run: cargo audit -f frontend/src-tauri/Cargo.lock

  # THE LINUX REMOTE-CONTROL BACKENDS, which nothing has ever RUN.
  #
  # crates/puca-capture/src/linux_impl.rs (282 lines, X11 via x11rb + SHM) and
  # crates/puca-input/src/linux_impl.rs (705 lines, XTEST) already exist, and so
  # do 673 lines of live tests for them. Every one of those tests is #[ignore]d
  # "needs a real X server", so the crates job compiles this code and runs none
  # of it. Until this job existed, the entire Linux host path rested on the
  # author's own machine.
  #
  # Xvfb is a real X server with the XTEST extension, which is exactly what both
  # suites ask for. `xvfb-run -a` picks a free display number so parallel jobs
  # cannot collide on :99.
  #
  # These tests are STRONGER than their Windows counterparts, which is why they
  # are worth running rather than merely compiling: the Windows live capture test
  # asserts "the frame has varied pixels", which passes on any real desktop. A
  # bare X root is uniformly black, so live_capture_x11 draws a known colour and
  # asserts the exact pixel value came back.
  linux-rc-live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable branch, pinned 2026-07-23
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: An X server with XTEST
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb x11-utils
      - name: X11 capture, against a real display
        run: xvfb-run -a -s "-screen 0 1280x1024x24" cargo test -p puca-capture --test live_capture_x11 --locked -- --ignored --test-threads=1 --nocapture
      - name: XTEST injection, against a real display
        run: xvfb-run -a -s "-screen 0 1280x1024x24" cargo test -p puca-input --test live_inject_x11 --locked -- --ignored --test-threads=1 --nocapture

  # THE LINUX DESKTOP BUILD, which nothing compiled until now.
  #
  # The shell is written to build off Windows -- every Windows-needing Tauri
  # command is registered behind #[cfg(all(windows, feature = "remote-control"))]
  # individually rather than the whole handler being gated, lib.rs carries
  # explicit #[cfg(not(windows))] branches, and wasapi/clipboard-win sit under
  # [target.'cfg(windows)'.dependencies]. That care was being maintained BY HAND:
  # the only desktop-shell build in CI ran on windows-latest, and the
  # ubuntu-latest job that names src-tauri only reads its lockfile for
  # cargo-audit. Nothing would have told you the day the Linux path stopped
  # compiling.
  #
  # `check`, not `test`: this exists to prove the non-Windows path still
  # compiles. The tests themselves are overwhelmingly #[cfg(windows)] and run in
  # crates-windows, so running them here would mostly assert nothing.
  #
  # build-agent.mjs first because tauri-build validates externalBin before it
  # compiles anything, and on Linux it wants binaries/puca-agent-<linux triple>.
  # The script derives that triple from `rustc -vV`, so it needs no arguments.
  desktop-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable branch, pinned 2026-07-23
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
      - name: Tauri v2 Linux system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev             libjavascriptcoregtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Build the Linux agent sidecar (tauri-build requires it to exist)
        working-directory: frontend
        run: node scripts/build-agent.mjs
      - name: Desktop shell compiles for Linux
        run: cargo check --manifest-path frontend/src-tauri/Cargo.toml --locked

  # EVERYTHING UNDER crates/ — the capture, encode, injection, agent and
  # service layer, `unsafe` included. None of it ran in CI until 2026-09-03:
  # the root Cargo.toml had no [workspace], so `cargo test` at the root built
  # the backend package and nothing else. Measured that day: 529 tests down
  # there, zero of them gated.
  #
  # TWO RUNNERS, ON PURPOSE. Roughly half those tests are #[cfg(windows)] —
  # this is a Windows product, and the half that matters most (the path jail
  # that decides which folders a remote controller may read, the injection
  # tag, the service's pipe) compiles nowhere else. A Linux-only job would go
  # green having never built them, which is worse than no job at all because
  # it looks like coverage. Linux is the fast one that catches ordinary
  # regressions; Windows is the one that can fail for a real reason.
  #
  # `--exclude puca` keeps the backend package out: it needs a database and is
  # already covered by the `backend` job below, with postgres attached.
  # `--locked` makes a stale Cargo.lock a failure rather than a silent
  # re-resolve — the lock is shared now, so drift would move every crate.
  # Tests needing real hardware carry #[ignore] with a reason and are skipped
  # here, which is why this runs headless.
  crates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable branch, pinned 2026-07-23
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Crate tests (Linux — the platform-independent half)
        run: cargo test --workspace --exclude puca --locked

  crates-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable branch, pinned 2026-07-23
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Crate tests (Windows — capture, injection, the service, the agent's path jail)
        run: cargo test --workspace --exclude puca --locked
      # The desktop shell is EXCLUDED from the workspace (tauri-cli owns its
      # layout), so --workspace does not reach it. It holds the global-hotkey
      # engine, the DPAPI seal and the tray, and it is Windows-only code — so
      # it is tested here, by name, or not at all.
      #
      # ITS BUILD SCRIPT NEEDS THE SIDECARS FIRST. tauri-build resolves
      # `externalBin` at build time and fails with "resource path
      # binaries\puca-agent-...exe doesn't exist" on a clean checkout, because
      # those are produced by build-agent.mjs and are gitignored. Building them
      # here is not just a prerequisite: it runs build-agent.mjs on a machine
      # that has never built this repo, which is exactly the case that would
      # have caught it reading a stale binary from the pre-workspace path.
      # The script imports only node builtins and its own crtStatic helper, so
      # no npm install is needed.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Build the agent + service sidecars (build-agent.mjs, clean machine)
        working-directory: frontend
        run: node scripts/build-agent.mjs
      - name: Desktop shell tests (frontend/src-tauri)
        run: cargo test --manifest-path frontend/src-tauri/Cargo.toml --locked

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: puca
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      # Only DATABASE_URL is strictly required to boot; the rest have defaults.
      # TEST_DATABASE_URL points the integration tests at the same CI DB so they
      # actually run instead of self-skipping.
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/puca
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/puca
      JWT_SECRET: ci-test-secret-not-for-production
      RUST_LOG: warn
      # Keep registration open so the API sweep can create its own users.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable branch, pinned 2026-07-23 — bump periodically for new Rust releases
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Build backend
        run: cargo build --release

      - name: Start server (applies embedded migrations) + wait for health
        run: |
          ./target/release/puca &
          echo $! > server.pid
          for i in $(seq 1 40); do
            if curl -sf -o /dev/null http://127.0.0.1:3000/; then echo "server up after ${i}s"; exit 0; fi
            sleep 1
          done
          echo "server did not become healthy"; exit 1

      - name: Rust unit + integration tests
        run: cargo test --release -- --test-threads=1

      - name: API regression sweep (feature-flows)
        working-directory: frontend
        run: |
          npm ci
          API=http://127.0.0.1:3000 node e2e/feature-flows.mjs

      - name: Stop server
        if: always()
        run: kill "$(cat server.pid)" 2>/dev/null || true
