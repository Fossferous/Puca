name: tests

# Regression gate so breakages are caught without relying on manual local runs.
# - frontend: typecheck + build + vitest (offline, always runs)
# - backend:  cargo build + start server (which applies migrations) + cargo test
#             + the feature-flows API regression, all against a Postgres service
on:
  push:
    # main is the trunk. It was [feature/e2ee-security-and-chat, main] while all
    # 309 commits of real work landed on feature/sfu-tier2, so CI never ran on
    # anything that shipped. Also match work/** so a session's branch is tested
    # BEFORE it is merged, which is the whole point of parallel branches.
    branches: [main, 'work/**']
  pull_request:
  workflow_dispatch:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Typecheck + build
        run: npm run build           # tsc -b && vite build
      - name: Unit tests (vitest)
        run: npm test                 # vitest run — offline, ~125 cases
      - name: Lite bundle (rc-exclusion-guard must pass)
        run: node scripts/build-lite.mjs   # VITE_ENABLE_RC=false: fails if remote-control code is in the graph
      # Two classes of defect that are invisible to tsc, vitest and eslint,
      # because the code is correct and the WORDS in it are wrong. Both have
      # shipped: a user-facing diagnostic telling people to install the APK
      # from download.example.com, and a "TODO: Replace with your production
      # server URL" sitting above the line that already did it, on the most
      # security-relevant configuration point in the client.
      - name: Source hygiene (placeholder domains, unowned TODO markers)
        run: node scripts/check-source-hygiene.mjs
      # docs/GETTING_STARTED.md pointed every new self-hoster at
      # `.agent/HANDOFF.md`, a directory scrubbed for the public repo. Needs the
      # git checkout (it asks git which paths are tracked and which are ignored
      # on purpose), which actions/checkout already provides.
      - name: Docs links resolve
        run: node ../scripts/check-docs-links.mjs
      # NON-BLOCKING on purpose: the registry's answer changes daily, so gating
      # merges on it makes CI fail for reasons no commit caused. The triage
      # lives in docs/NPM_ADVISORIES.md; this step is what makes drift from it
      # visible. If the log and that file disagree, the file is out of date.
      - name: npm audit (advisory drift — never blocks)
        run: npm audit --audit-level=high || true

  # The deploy scripts run once, as root, on a box that has already been paid
  # for, and their failures are silent: a backup that restores nothing, a config
  # world-readable for the moment it holds a secret, a download page advertising
  # last release. Each of these tests runs offline against fixtures and stubs —
  # no host is contacted and no real hosts.conf is read.
  deploy-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: coturn config rendering
        run: bash deploy/migrate/render-turn-conf.test.sh
      - name: provision.sh (file modes, secrets off argv)
        run: bash deploy/migrate/provision.test.sh
      - name: backup-keys.sh (the key/password split, and its file modes)
        run: bash deploy/ops/backup-keys.test.sh
      - name: dual-ship.sh / check-versions.sh refusal gates
        run: bash deploy/ops/ship-gates.test.sh

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: puca
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      # Only DATABASE_URL is strictly required to boot; the rest have defaults.
      # TEST_DATABASE_URL points the integration tests at the same CI DB so they
      # actually run instead of self-skipping.
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/puca
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/puca
      JWT_SECRET: ci-test-secret-not-for-production
      RUST_LOG: warn
      # Keep registration open so the API sweep can create its own users.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable branch, pinned 2026-07-23 — bump periodically for new Rust releases
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Build backend
        run: cargo build --release

      - name: Start server (applies embedded migrations) + wait for health
        run: |
          ./target/release/puca &
          echo $! > server.pid
          for i in $(seq 1 40); do
            if curl -sf -o /dev/null http://127.0.0.1:3000/; then echo "server up after ${i}s"; exit 0; fi
            sleep 1
          done
          echo "server did not become healthy"; exit 1

      - name: Rust unit + integration tests
        run: cargo test --release -- --test-threads=1

      - name: API regression sweep (feature-flows)
        working-directory: frontend
        run: |
          npm ci
          API=http://127.0.0.1:3000 node e2e/feature-flows.mjs

      - name: Stop server
        if: always()
        run: kill "$(cat server.pid)" 2>/dev/null || true
