# Dependency updates — SECURITY ONLY.
#
# `open-pull-requests-limit: 0` switches OFF routine version updates while
# leaving SECURITY updates untouched: Dependabot still opens a PR the day an
# advisory lands against something in a lockfile, which is the part worth having.
#
# MEASURED, which is why this setting changed within a day of the file being
# added. Turning version updates on produced ELEVEN pull requests at once and
# then, on inspection, NINE of them failed CI for real reasons — steps ran, jobs
# broke. #21 (27 crates) broke four jobs; #22 (15 tauri crates) broke
# crates-windows. Only str0m passed clean.
#
# For a solo maintainer that is not a safety net, it is a queue of broken
# branches that makes the repository look abandoned to anyone who visits, and
# trains you to ignore the one PR that matters. Routine bumps can be done
# deliberately, in a batch, when there is appetite to fix what they break.
# Advisories cannot wait, so those still arrive.

# Dependency updates.
#
# WHY THIS EXISTS. Púca ships end-to-end encryption and a remote-desktop agent,
# so a vulnerable transitive dependency is not cosmetic. Nothing in this
# repository watched for one: no scanner ran in CI and no bot opened a PR, so an
# advisory against a crate in Cargo.lock or a package in package-lock.json could
# sit unnoticed indefinitely.
#
# GROUPED DELIBERATELY. Ungrouped, four ecosystems across five manifests produce
# a stream of single-dependency PRs that a one-person project stops reading —
# and a bot nobody reads is worse than no bot, because it trains you to ignore
# exactly the PR that matters. Security updates are NOT grouped: Dependabot
# always raises those separately, so they arrive on their own and stand out.
#
# MAJORS ARE GROUPED TOO, not split out. The first run of this file proved why:
# with only minor+patch grouped, eleven PRs landed at once because every major
# arrived on its own — among them okhttp 4->5, which is the Android
# push-delivery transport, and actions/setup-node 4->7. One grouped PR per
# ecosystem is still reviewable; eleven is a wall you stop reading, which is the
# failure this file was meant to avoid.
version: 2
updates:
  # --- Rust: the backend plus every crate under crates/ (one workspace) ------
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      cargo:
        applies-to: version-updates
        update-types: ["major", "minor", "patch"]

  # The desktop shell is EXCLUDED from the root workspace (see Cargo.toml
  # `exclude`), so the entry above does not reach it and it needs its own.
  - package-ecosystem: cargo
    directory: "/frontend/src-tauri"
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      tauri:
        applies-to: version-updates
        update-types: ["major", "minor", "patch"]

  # So is the DeepFilterNet wasm crate — which produces a binary committed to
  # the tree and shipped to every web and desktop client.
  - package-ecosystem: cargo
    directory: "/frontend/df-wasm"
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    groups:
      df-wasm:
        applies-to: version-updates
        update-types: ["major", "minor", "patch"]

  # --- The web / desktop / mobile client ------------------------------------
  - package-ecosystem: npm
    directory: "/frontend"
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      npm:
        applies-to: version-updates
        update-types: ["major", "minor", "patch"]

  # --- The Android app ------------------------------------------------------
  - package-ecosystem: gradle
    directory: "/frontend/android"
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    groups:
      android:
        applies-to: version-updates
        update-types: ["major", "minor", "patch"]

  # --- The workflows themselves ---------------------------------------------
  # Every action in .github/workflows is pinned to a commit SHA, which is the
  # right call and also means a pinned action never updates on its own. This is
  # what stops those pins from silently rotting.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    groups:
      actions:
        applies-to: version-updates
        update-types: ["major", "minor", "patch"]
