# ONE WORKSPACE, so `cargo test --workspace` reaches the crates.
#
# WHAT THIS FIXES. Without it, the root package is the only thing `cargo test`
# builds: every crate under crates/ — the whole capture, encode, input, agent
# and service layer, `unsafe` included — was invisible to the gate and to CI.
# Measured on 2026-09-03: 529 tests live down there and CI ran none of them.
#
# The root package stays the workspace ROOT, so a bare `cargo test` still means
# "the backend" exactly as before and nothing that runs it has to change. The
# crates come along only when you ask for them by name or with `--workspace`.
#
# TWO CONSEQUENCES WORTH KNOWING, both real and both accepted:
#  - Build output MOVES to this directory's target/. A member built with
#    `--manifest-path crates/X/Cargo.toml` no longer writes to
#    crates/X/target/. frontend/scripts/build-agent.mjs reads the built agent
#    and service binaries and was updated with it; a stale copy under the old
#    path would otherwise have been staged into the installer forever.
#  - ONE Cargo.lock, here. The crates' own lock files stop being consulted, so
#    resolution is shared. resolver = "2" is set explicitly rather than
#    inherited, because feature unification is the one thing that could change
#    a crate's behaviour without changing a line of its code.
[workspace]
members = ["crates/*"]
resolver = "2"
# frontend/src-tauri sits inside this directory tree, so cargo would consider
# it a member by location and REFUSE to build it ("believes it's in a
# workspace when it's not") — which is the installer, i.e. everything. It is
# excluded rather than added: tauri-cli drives that crate with its own layout
# and its own target directory, and moving those a day after a release is a
# risk with no upside. Its tests are not lost — CI runs them directly, on
# Windows, where its code actually compiles (see the crates-windows job).
# frontend/df-wasm is excluded for a second reason on top of that one: it
# carries its own `[profile.release]` (opt-level = "s", lto = true) and a
# member's profile section is IGNORED inside a workspace. Making it a member
# would quietly drop both and ship a fatter noise-suppression blob to every
# browser, with no error anywhere.
exclude = ["frontend/src-tauri", "frontend/df-wasm"]

[package]
name = "puca"
version = "0.8.21"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "Self-hosted, end-to-end-encrypted chat, voice, and screen-share server"
repository = "https://github.com/Fossferous/puca"

[dependencies]
axum = { version = "0.7", features = ["ws", "multipart"] }
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.8", features = ["postgres", "runtime-tokio", "tls-native-tls", "chrono"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# mediasoup = "0.20"
# scap = "0.1.0-beta.1"
srp = "0.6"
bitflags = "2.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "registry"] }
anyhow = "1.0"
hex = "0.4"
sha2 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
rand = "0.8"
dotenv = "0.15"
uuid = { version = "1", features = ["v4", "fast-rng"] }
dashmap = "6.1.0"
jsonwebtoken = { version = "10.2.0", features = ["rust_crypto"] }
futures = "0.3.31"
tower-http = { version = "0.6.7", features = ["cors", "fs"] }
tower_governor = "0.4.2"
governor = "0.6.3"
tokio-util = { version = "0.7", features = ["io"] }
# For TURN credential generation
hmac = "0.12"
sha1 = "0.10"
base64 = "0.22"
# E2EE account recovery: X25519 DH proof-of-possession + HKDF (must match the
# frontend's @noble x25519/hkdf byte-for-byte).
x25519-dalek = { version = "2", features = ["static_secrets"] }
# Device attestation: verifies the Ed25519 signature a client produces to prove
# WHICH of the account's devices a connection is (see ws.rs). Already present
# transitively via jsonwebtoken; promoted to a direct dependency because we now
# call it ourselves.
ed25519-dalek = "2"
# The wake transport is a trait object (src/wake) so the FCM doorbell, the
# no-credentials no-op and test recorders are interchangeable — what makes the
# layer testable without a Firebase project. Already present transitively;
# promoted because we call it ourselves (same as ed25519-dalek above).
async-trait = "0.1"
hkdf = "0.12"
# For email sending
lettre = { version = "0.11", features = ["tokio1-native-tls", "builder", "smtp-transport"] }
# Used by the SFU control plane for the LiveKit RemoveParticipant admin call
# (src/sfu.rs), so it must be a real dependency, not dev-only.
reqwest = { version = "0.11", features = ["json", "blocking"] }

[dev-dependencies]
axum-test = "14"
tower = "0.4"
tokio-test = "0.4"
# Cross-language known-answer test for the media frame AEAD (tests/media_aead_kat.rs).
# The SERVER never encrypts media — it relays opaque frames — so this is a dev
# dependency only. The native host agent (Phase 6) will take it as a real one.
aes-gcm = "0.10"

# Workaround for Windows PDB linker errors (LNK1318)
# WORKSPACE-WIDE since the [workspace] above: a root profile governs every
# member, and a member's own profile section is ignored. These two were a
# Windows PDB/LNK1318 workaround for the backend; the cost of them applying to
# the crates as well is that `cargo test -p puca-agent` builds without debug
# info, so a panic in the unsafe capture/injection layer gives no line numbers.
# Raise `debug` here when you need to step through one of those.
[profile.dev]
incremental = false
debug = 0
split-debuginfo = "off"

[profile.test]
incremental = false
debug = 0
split-debuginfo = "off"
