apply plugin: 'com.android.application'

// Release signing: the SAME keystore as the Púca app (frontend/android/app/
// build.gradle has the full story), so both apps carry one publisher key.
// Without it a release build must not happen — an unsigned APK cannot
// upgrade an installed one and looks like a successful release until every
// user fails to update. Debug builds are unaffected.
def keystorePropsFile = [
    new File(System.getProperty('user.home'), '.android/puca-keystore.properties'),
    new File(System.getProperty('user.home'), '.android/sovereign-keystore.properties'),
].find { it.exists() }
def keystoreProps = new Properties()
if (keystorePropsFile != null) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}
gradle.taskGraph.whenReady { graph ->
    def buildingRelease = graph.allTasks.any { t ->
        t.name.toLowerCase().contains('release') &&
            (t.name.startsWith('assemble') || t.name.startsWith('bundle') || t.name.startsWith('package'))
    }
    // The test-only cleartext switch must never reach a release (see
    // scripts/build-notes-app.mjs, which refuses it too).
    if (buildingRelease && System.getenv('NOTES_ALLOW_HTTP_API') == '1') {
        throw new GradleException(
            "NOTES_ALLOW_HTTP_API=1 is TEST-ONLY (http WebView origin, cleartext traffic). " +
            "Refusing to build a release APK with it set.")
    }
    if (buildingRelease && keystorePropsFile == null && !project.hasProperty('allowUnsignedRelease')) {
        throw new GradleException(
            "No release keystore found for Púca Notes. Looked for ~/.android/puca-keystore.properties " +
            "and ~/.android/sovereign-keystore.properties. An unsigned release APK cannot upgrade an " +
            "installed app. Provide the keystore, or pass -PallowUnsignedRelease deliberately.")
    }
}

// The version lives in frontend/src-tauri/tauri.conf.json and nowhere else
// (CLAUDE.md); read it so the Notes app always carries the release it was
// built from. versionCode = major*1_000_000 + minor*10_000 + patch (the main
// app's scheme without its variant digit — Notes has one variant).
def tauriConf = new groovy.json.JsonSlurper().parse(file('../../../src-tauri/tauri.conf.json'))
def notesVersionName = tauriConf.version as String
def notesVersionParts = notesVersionName.tokenize('.').collect { it as int }
def notesVersionCode = notesVersionParts[0] * 1000000 + notesVersionParts[1] * 10000 + notesVersionParts[2]
logger.lifecycle("PUCA NOTES versionName=${notesVersionName} versionCode=${notesVersionCode} applicationId=com.sovereign.notes (installs beside Púca)")

android {
    namespace = "com.sovereign.notes"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        // Its OWN id, so Notes installs BESIDE the Púca app (com.sovereign.app)
        // with its own storage and its own sign-in.
        applicationId "com.sovereign.notes"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode notesVersionCode
        versionName notesVersionName
        // Cleartext (http) API traffic is blocked by Android for targetSdk 28+
        // and stays blocked here — except in the one TEST build that talks to
        // a throwaway backend on the host (NOTES_ALLOW_HTTP_API=1, see
        // ../../capacitor.config.ts). The manifest reads this placeholder.
        manifestPlaceholders = [notesCleartext: System.getenv('NOTES_ALLOW_HTTP_API') == '1' ? 'true' : 'false']
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (keystorePropsFile != null) {
                storeFile new File(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (keystorePropsFile != null) {
                signingConfig signingConfigs.release
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
