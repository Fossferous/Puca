[package]
name = "app"
version = "0.1.0"
description = "Puca desktop shell: the self-hosted, end-to-end encrypted chat client (full and lite variants)"
authors = ["Puca contributors"]
license = "AGPL-3.0-or-later"
repository = "https://github.com/Fossferous/Puca"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.3", features = [] }
# build.rs reads the app identifier out of tauri.conf.json (or the merged
# TAURI_CONFIG the CLI supplies for --config overlays) so the crate cannot
# disagree with the bundle about where its data directory lives.
serde_json = "1.0"

# "remote-control" gates My Devices screen-share/input-control, Wake-on-LAN +
# device presence, and the remote file browser/transfer (grants, shares,
# unattended hosting, the host agent bridge, port forwarding). It does NOT
# gate anything shared with another feature: voice calls, Clips (both use
# puca-capture/puca-encode and the audio/hotkey/capture-bar plumbing), or
# ordinary DM file attachments (file_transfer.rs's transfer_begin/write/
# finish/abort — only its RC-only shareable_folders command is gated).
# Default on: the normal desktop build is unchanged. A "lite" build passes
# `--no-default-features` to drop it.
[features]
default = ["remote-control"]
remote-control = [
    "dep:puca-ua",
    "dep:puca-service",
    "dep:clipboard-win",
]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0" # required by tauri::generate_context! macro expansion
log = "0.4"
tauri = { version = "2.9.4", features = ["devtools", "tray-icon", "image-png"] }
tauri-plugin-log = "2"
tauri-plugin-process = "2.3.1"
tauri-plugin-notification = "2"
# The OS Save As dialog for received files / attachments ("Ask where to
# save files"). Registered for dialog:allow-save only — see capabilities.
tauri-plugin-dialog = "2"
# In-place auto-update: banner click downloads the signed installer and
# relaunches (no manual reinstall). Manifest at https://download.example.com/latest.json.
tauri-plugin-updater = "2"
# Remember window size/position/maximized across launches (standard desktop-app behavior).
tauri-plugin-window-state = "2"
# Start with the OS, so a device can be reachable without someone launching the
# app first. Writes HKCU\...\Run on Windows (no admin) / ~/.config/autostart.
tauri-plugin-autostart = "2"
# ONE process per machine. Without it, autostart plus a user double-click gives
# two processes, two WebSocket connections and two attestations for one device —
# and on Windows the second window gets NO WEBVIEW AT ALL, because WebView2 locks
# its user-data folder. That failure is completely silent: a blank window, an
# empty title, nothing in any log. It cost most of a debugging session.
tauri-plugin-single-instance = "2"
# Opens the release download page in the system browser (open_external command)
opener = "0.7"

# Verifies a RESUMED transfer: the receiver never saw the bytes written by the
# earlier attempt, so the only way to know the finished file is the file that was
# offered is to hash it at rest.
sha2 = "0.10"

# Input injection, shared with the native host agent (crates/puca-input).
# A plain PATH dependency, deliberately NOT a Cargo workspace: a workspace moves
# target/ and would break the container build path documented in CLAUDE.md.
puca-input = { path = "../../crates/puca-input" }

# Clips auto-arm (clip_capture.rs): the SAME DXGI-duplication capture and MFT
# H.264 encoder the native remote-desktop agent uses for unattended, no-picker
# capture — reused here for a LOCAL sink instead of a WebRTC peer.
puca-capture = { path = "../../crates/puca-capture" }
puca-encode = { path = "../../crates/puca-encode" }

# The unattended-access gate. Host side only: it VERIFIES a controller's
# signature and never derives anything from a passphrase, so no Argon2id here.
# RC-only (unattended hosting arm/disarm) — optional, see [features] above.
puca-ua = { path = "../../crates/puca-ua", optional = true }

# This device's identity keypair (device_key.rs). NOT optional and NOT
# remote-control: device ATTESTATION signs with it to prove which device a
# connection is, and Android push delivery addresses frames to the id that
# produces. public_identity() needs BOTH curves — the x25519 half is this
# device's public key, not just the input to the remote-control key agreement.
# Only device_key_dh and device_key_forget are gated, inside the module.
ed25519-dalek = { version = "2", features = ["rand_core"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }
rand = "0.8"
image = { version = "0.24", features = ["png"], default-features = false }

[dependencies.base64]
# audio_capture.rs encodes PCM chunks for the 'audio-data' event
version = "0.22"

# Reused for its install/status logic, so the app and the elevated helper cannot
# end up disagreeing about what "installed" means. A COMMON dependency, not a
# cfg(windows) one: lan.rs and wol.rs re-export its cross-platform lan/wol
# modules on every OS (the crate builds and tests green on Linux; only its
# SCM/install pieces are internally Windows-gated).
[dependencies.puca-service]
path = "../../crates/puca-service"
# RC-only (the unattended-hosting SYSTEM service): optional, switched on by
# the remote-control feature above via `dep:puca-service`, so the lite build
# never compiles it. A feature gates a common dependency just as well as a
# target-specific one, so being common (the reason above) costs nothing.
optional = true

# Windows-only: per-app audio capture (audio_capture.rs, WASAPI process
# loopback) + the Win32 shim hiding WebView2's screen-capture bar (capture_bar.rs)
[target.'cfg(windows)'.dependencies]
# Clipboard for device sessions. navigator.clipboard.readText() needs document
# focus and a permission grant, so it cannot serve a background HOST — which is
# exactly when a device session needs it. RC-only — optional.
clipboard-win = { version = "5", optional = true }
wasapi = "0.22"
sysinfo = "0.32"
# Win32_UI_Shell is for SHGetFileInfoW in audio_capture.rs (app icons for the
# share picker). Without it the crate does not compile at all — and NO gate
# catches that: this crate is not in the root workspace, so `cargo test` at the
# repo root never touches it, and the frontend gates are TypeScript only. It is
# only ever built by `npm run tauri:build`, i.e. at release time.
# Win32_System_IO = CancelSynchronousIo (the agent-pipe read deadline in
# agent_ipc.rs); Win32_System_Pipes = the test-only named-pipe server that
# proves the deadline fires. Win32_System_Services = the read-only SCM query in
# rc_leftovers.rs, which detects a SovereignRemote service a previous FULL
# install left behind (needed in the LITE build especially).
windows = { version = "0.58", features = ["Win32_Media_Audio", "Win32_Devices_Display", "Win32_System_Com", "Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_System_Registry", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_System_LibraryLoader", "Win32_Graphics_Gdi", "Win32_UI_HiDpi", "Win32_System_SystemInformation", "Win32_Security_Cryptography", "Win32_Security", "Win32_System_Shutdown", "Win32_System_RemoteDesktop", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock", "Win32_System_IO", "Win32_System_Pipes", "Win32_System_Services"] }


