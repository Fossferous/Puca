[package]
name = "df-wasm"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "DeepFilterNet noise suppression compiled to WebAssembly for Puca"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2"
# Same ndarray major.minor as deep_filter so ArrayView2 types unify.
ndarray = "0.15"
deep_filter = { git = "https://github.com/Rikorose/DeepFilterNet", tag = "v0.5.6", features = ["tract", "default-model"] }
# getrandom is a transitive dep; the "js" feature makes it build for wasm.
getrandom = { version = "0.2", features = ["js"] }

[profile.release]
opt-level = "s"
lto = true
