# cargo-audit configuration (https://github.com/rustsec/rustsec/tree/main/cargo-audit).
# Advisories listed here have been explicitly reviewed and accepted with a rationale.
# Everything else still fails `cargo audit`.

[advisories]
ignore = [
    # RUSTSEC-2023-0071 — "Marvin Attack": timing sidechannel in the `rsa` crate,
    # pulled in by `jsonwebtoken`. User-facing tokens are HS256 and never touch it.
    # ONE RSA private-key operation DOES happen: with FCM wake configured
    # (FCM_PROJECT_ID + FCM_SERVICE_ACCOUNT_FILE), src/wake/fcm.rs signs an RS256
    # service-account assertion on every OAuth token refresh (~hourly). Marvin
    # needs an attacker who can submit chosen inputs and time the private-key
    # operation; here the message is built by this process from fixed claims and
    # the current time, the only party that ever sees the signature is Google,
    # and no network peer can trigger or time the signing. Judged unreachable on
    # that basis, not on "no RSA at all". No fixed `rsa` release exists upstream.
    # Re-evaluate if any RSA private-key operation is ever driven by
    # client-supplied input.
    "RUSTSEC-2023-0071",

    # RUSTSEC-2026-0217 - integer overflow in tract-nnef's NNEF tensor parser,
    # out-of-bounds read on MODEL LOAD; tract-nnef 0.19.16, fixed in 0.21.16+.
    # Present ONLY in frontend/df-wasm/Cargo.lock (the noise-suppression wasm),
    # which CI scans since 2026-09-16 - this was found on the first scan.
    #
    # Reachability: the parser runs once, at init, over the DFN3 model that is
    # EMBEDDED in the wasm itself (`deep_filter`'s `default-model` feature); no
    # model ever arrives from a user, a peer or the network, so there is no
    # input for the overflow to be reached through. And it runs inside the
    # browser's WebAssembly sandbox, where an out-of-bounds read is a trap or a
    # read of the module's own linear memory - not a disclosure across it.
    #
    # NOT fixable here: tract's version is pinned by upstream DeepFilterNet
    # (git tag v0.5.6), not by this crate. Re-evaluate when df-wasm is rebuilt
    # against a newer DeepFilterNet (the fix comes for free), or if the model
    # is ever loaded from anywhere but the bundle.
    "RUSTSEC-2026-0217",

    # RUSTSEC-2026-0387 - timing variability in crypto-bigint 0.5.5 operations meant
    # to be constant-time (subtraction, zero counting, division, Montgomery
    # multiplication), published 2026-10-23; fixed only in 0.7.6+, which the
    # elliptic-curve 0.13 line cannot take. ACCEPTED TEMPORARILY, with the fix named:
    #
    # It is reached only through elliptic-curve 0.13 (p256, p384, ecdsa): from
    # `jsonwebtoken`'s rust_crypto backend, whose ES256/ES384 paths nothing here uses
    # (user tokens are HS256), and from src/wake/webpush.rs, which signs a VAPID
    # ES256 token with the long-lived VAPID_PRIVATE_KEY for every Web Push and does
    # one ephemeral ECDH per push. A network peer can TRIGGER signings (a message to
    # a subscribed user; per-user rate limited) but cannot TIME them: pushes are
    # queued and sent by a background task, off the sender's request path, and the
    # signature goes only to the browser's push service. What is left is a
    # co-located observer of the host's microarchitecture. A leaked VAPID key lets
    # its holder wake a browser only if they also hold that browser's push endpoint
    # (kept in this server's database and the browser), and the payload is a
    # constant either way (src/wake/mod.rs).
    #
    # The fix: move webpush.rs, and jsonwebtoken's backend, onto aws-lc-rs (already
    # in this lock, constant-time); crypto-bigint then leaves the lock and this entry
    # goes with it. Re-evaluate at once if a client can ever drive or time one of
    # these crates' secret-key operations.
    "RUSTSEC-2026-0387",

    # RUSTSEC-2026-0459 - SQLite before 3.54.0 can return uninitialised page-cache
    # memory when a database is opened beside a crafted `-wal` file of another page
    # size (CVE-2026-119375), in libsqlite3-sys 0.30.1's bundled SQLite; published
    # 2026-10-30, fixed in libsqlite3-sys 0.39.0.
    #
    # NOT COMPILED: the crate is in Cargo.lock only because sqlx 0.8 lists its
    # optional `sqlx-sqlite` driver there (a weak `sqlx-sqlite?/...` feature keeps it
    # in the lock whether or not it is enabled). This repo enables sqlx's `postgres`
    # feature and no other driver (Cargo.toml); `cargo tree -i libsqlite3-sys
    # --workspace --target all` prints nothing, and neither the backend binary nor
    # the desktop app contains SQLite code (checked 2026-11-13 on 0.9.861's builds;
    # frontend/src-tauri/Cargo.lock does not list the crate at all). Nothing here
    # opens a SQLite database, so there is no file for the bug to be reached through.
    #
    # NOT fixable by an update: sqlx-sqlite 0.8.6 requires libsqlite3-sys 0.30.
    # Re-evaluate at once if any crate here enables SQLite, and drop this entry when
    # sqlx moves to a libsqlite3-sys of 0.39 or later.
    "RUSTSEC-2026-0459",
]
